<html lang="en" data-bs-theme="light">

  <head>
    <title>Escape the room!</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js"></script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <style>
    .optionless {
    padding-bottom: 3%;
  }
  </style>
  <body>
    <main class="d-flex flex-nowrap h-100">
      <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-light" style="width: 380px;">
        <h2 class="d-flex " style="justify-content: center;">Actions</h2>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="optionless">
            <button hx-get="/look" hx-target="#content" hx-swap="outerHTML" class="btn btn-secondary"> look </button>
          </li>
          <li class="optionless">
            <button hx-get="/inventory" hx-target="#content" hx-swap="outerHTML" class="btn btn-secondary"> inventory </button>
          </li>
          <li class="optionless">
            <button hx-get="/wait" hx-target="#content" hx-swap="outerHTML" class="btn btn-secondary"> wait </button>
          </li>
          <li>
            <form hx-post="/get" hx-swap="outerHTML" hx-target="#content">
              <fieldset>
                <input type="submit" value="get" class="btn btn-secondary">
                <input type="text" name="item_name" value="">
              </fieldset>
            </form>
          </li>
          <li>
            <form hx-post="/drop" hx-swap="outerHTML" hx-target="#content">
              <fieldset>
                <input type="submit" value="drop" class="btn btn-secondary">
                <input type="text" name="item_name" value="">
              </fieldset>
            </form>
          </li>
        </ul>
        <hr>
      </div>
      <div class="d-flex flex-column border-start boarder-secondary"></div>
      <div class="d-flex flex-column" style="padding-left: 1%; padding-top: 2%; width: 100%;">
        <h2> {{ player.location.name }} </h2>
        <hr>
        <div class="overflow-auto"">
                  <div id="content"></div>
        </div>
      </div>
    </main>
  </body>
</html>
